<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio | Web Developer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a0a;
      --bg-card: rgba(255, 255, 255, 0.05);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ========================================
       HERO SECTION
       ======================================== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 80px;
      background: linear-gradient(135deg, #0a0a0a 0%, #0f172a 50%, #0a0a0a 100%);
      position: relative;
      overflow: hidden;
    }

    /* Animated gradient orbs */
    .hero::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float1 8s ease-in-out infinite;
      z-index: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float2 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-30px) translateX(20px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(30px) translateX(-20px); }
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* Left Side - Text Content */
    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 12px;
      color: var(--text-secondary);
      width: fit-content;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }

    .hero-text h1 {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero-text h1 span {
      color: var(--text-secondary);
    }

    .hero-text .title {
      font-size: 24px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-text .subtitle {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-dark);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.25);
    }

    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .social-links a {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      transition: all 0.3s ease;
      text-decoration: none;
      font-size: 18px;
    }

    .social-links a:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-3px);
      color: var(--text-primary);
    }

    /* Right Side - Image Card (Glassmorphism) */
    .hero-image {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .image-card {
      position: relative;
      width: 380px;
      height: 480px;
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.5),
        0 0 100px -30px rgba(99, 102, 241, 0.15);
      overflow: hidden;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Floating Badge */
    .floating-badge {
      position: absolute;
      bottom: -16px;
      right: -16px;
      padding: 16px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .floating-badge .count {
      display: block;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .floating-badge .label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ========================================
       RESPONSIVE STYLES
       ======================================== */
    @media (max-width: 968px) {
      .hero-content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 48px;
      }

      .hero-text {
        align-items: center;
        order: 2;
      }

      .hero-text h1 {
        font-size: 42px;
      }

      .hero-text .subtitle {
        max-width: 100%;
      }

      .hero-image {
        order: 1;
      }

      .image-card {
        width: 300px;
        height: 380px;
      }
    }

    @media (max-width: 640px) {
      .hero-text h1 {
        font-size: 36px;
      }

      .hero-text .title {
        font-size: 20px;
      }

      .image-card {
        width: 260px;
        height: 340px;
      }

      .floating-badge {
        padding: 12px 18px;
      }

      .floating-badge .count {
        font-size: 22px;
      }
    }

    @media (max-width: 400px) {
      .image-card {
        width: 220px;
        height: 290px;
      }
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        
        <!-- LEFT: Text Content -->
        <div class="hero-text">
          <!-- Badge -->
          <div class="badge">
            <span class="dot"></span>
            Available for work
          </div>
          
          <!-- Main Heading -->
          <h1>Hi, I'm <br><span>Abdel-Arip</span></h1>
          
          <!-- Title -->
          <p class="title">Web Designer</p>
          
          <!-- Description -->
          <p class="subtitle">I craft beautiful, functional, and user-friendly websites that help businesses stand out in the digital world.</p>
          
          <!-- CTA Button -->
          <a href="#portfolio" class="btn btn-primary">
            View Work
            <i class="fas fa-arrow-right"></i>
          </a>
          
          <!-- Social Links -->
          <div class="social-links">
            <a href="https://github.com/Arip-03" target="_blank" aria-label="GitHub">
              <i class="fab fa-github"></i>
            </a>
            <a href="https://www.facebook.com/abdel.arip.srpd" target="_blank" aria-label="Facebook">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </div>

        <!-- RIGHT: Image Card with Glassmorphism -->
        <div class="hero-image">
          <div class="image-card">
            <!-- PROPER IMAGE PATH: src/assets/me.png -->
            <img src="public/me.png" alt="Abdel-Arip Profile">
          </div>
          
          <!-- Floating Badge -->
          <div class="floating-badge">
            <span class="count">6</span>
            <span class="label">Projects</span>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script>
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Add simple fade-in animation on load
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.hero-content').style.opacity = '0';
      document.querySelector('.hero-content').style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        document.querySelector('.hero-content').style.opacity = '1';
      }, 100);
    });
  </script>
</body>
</html>
